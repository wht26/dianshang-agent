[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wang-commerce-agent"
version = "0.10.0"
description = "A buyer-facing product and after-sales support agent for apparel, shoes and bags"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4", "redis>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.package-data]
wang = ["static/*", "knowledge/*.md", "shops/*.json"]

[tool.setuptools.packages.find]
include = ["wang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
