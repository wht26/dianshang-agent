name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wang
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: wang_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wang -d wang_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://wang:ci-only@localhost:5432/wang_test
      TEST_REDIS_URL: redis://localhost:6379/0
      WANG_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest -q --tb=short 2>&1 | tee test-output.txt
      - name: Publish test summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          output = Path('test-output.txt')
          if output.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
                  report.write('```text\n' + output.read_text()[-50000:] + '\n```\n')
          PY
